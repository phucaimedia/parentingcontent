<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Điều Hành Quản Lý Series Video</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-4 md:p-8">
  <div class="max-w-6xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-slate-800">🎬 Quản Lý Series Video</h1>
      <button onclick="loadData()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700">↻ Làm mới</button>
    </div>
    <div id="status" class="text-slate-500 mb-4">Đang tải dữ liệu...</div>
    <div class="overflow-x-auto bg-white rounded-xl shadow">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-800 text-white">
          <tr>
            <th class="px-3 py-3 text-left">STT</th>
            <th class="px-3 py-3 text-left">SKU</th>
            <th class="px-3 py-3 text-left">Series</th>
            <th class="px-3 py-3 text-left">Tiêu đề video</th>
            <th class="px-3 py-3 text-left">Trạng thái</th>
            <th class="px-3 py-3 text-left">KB Demo</th>
            <th class="px-3 py-3 text-left">KB Final</th>
            <th class="px-3 py-3 text-left">Video Demo</th>
            <th class="px-3 py-3 text-left">Video Final</th>
            <th class="px-3 py-3 text-left">Cập nhật</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  
  <div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl max-w-5xl w-full max-h-[85vh] overflow-y-auto p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modalTitle" class="font-bold text-lg"></h3>
        <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-slate-400 hover:text-slate-700 text-2xl">&times;</button>
      </div>
      <div id="modalBody" class="text-sm text-slate-700 leading-relaxed"></div>
    </div>
  </div>

  <script>
    const LIST_URL = "https://nguyenthienphuc1701.app.n8n.cloud/webhook/series-list";

    function esc(s){ return (s||"").toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    // --- Render markdown (+ inline HTML sẵn có như <b style="color:red">) thành HTML ---
    function renderInline(s){
      s = (s || '');
      // **đậm** -> <strong>  (giữ nguyên các thẻ HTML sẵn có như <b style="color:red;">)
      s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
      // *nghiêng* -> <em>
      s = s.replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, '$1<em>$2</em>');
      return s;
    }

    function renderTable(tblLines){
      const rows = tblLines.map(r =>
        r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim())
      );
      const isSep = cells => cells.length && cells.every(c => /^:?-{2,}:?$/.test(c));
      let header = null; const body = [];
      rows.forEach(cells => {
        if (isSep(cells)) return;
        if (header === null) header = cells; else body.push(cells);
      });
      let h = '<div class="overflow-x-auto my-3"><table class="min-w-full border border-slate-300 text-sm">';
      if (header){
        h += '<thead class="bg-slate-100"><tr>';
        header.forEach(c => h += '<th class="border border-slate-300 px-3 py-2 text-left font-semibold align-top">' + renderInline(c) + '</th>');
        h += '</tr></thead>';
      }
      h += '<tbody>';
      body.forEach(cells => {
        h += '<tr class="align-top">';
        cells.forEach(c => h += '<td class="border border-slate-300 px-3 py-2 align-top">' + renderInline(c) + '</td>');
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      return h;
    }

    function mdToHtml(md){
      const lines = (md || '').split(/\r?\n/);
      let html = ''; let i = 0; let inList = false;
      const closeList = () => { if (inList){ html += '</ul>'; inList = false; } };
      const isTableRow = l => /^\s*\|.*\|\s*$/.test(l);
      while (i < lines.length){
        const line = lines[i];
        if (isTableRow(line)){
          const tbl = [];
          while (i < lines.length && isTableRow(lines[i])){ tbl.push(lines[i]); i++; }
          closeList(); html += renderTable(tbl); continue;
        }
        const t = line.trim();
        if (t === ''){ closeList(); i++; continue; }
        if (/^-{3,}$/.test(t)){ closeList(); html += '<hr class="my-4 border-slate-200">'; i++; continue; }
        const hm = t.match(/^(#{1,6})\s+(.*)$/);
        if (hm){
          closeList();
          const lvl = hm[1].length;
          const size = lvl <= 1 ? 'text-xl' : lvl === 2 ? 'text-lg' : 'text-base';
          html += '<h' + lvl + ' class="font-bold ' + size + ' text-slate-800 mt-4 mb-2">' + renderInline(hm[2]) + '</h' + lvl + '>';
          i++; continue;
        }
        const lm = t.match(/^[-*]\s+(.*)$/);
        if (lm){
          if (!inList){ html += '<ul class="list-disc pl-5 space-y-1 my-2">'; inList = true; }
          html += '<li>' + renderInline(lm[1]) + '</li>';
          i++; continue;
        }
        closeList();
        html += '<p class="my-2">' + renderInline(t) + '</p>';
        i++;
      }
      closeList();
      return html;
    }

    function showDemo(title, body){
      document.getElementById('modalTitle').textContent = title;
      const el = document.getElementById('modalBody');
      el.innerHTML = body ? mdToHtml(body) : '<span class="text-slate-400">(chưa có nội dung)</span>';
      const m = document.getElementById('modal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }

    function toEmbed(url){
      url = (url||'').trim();
      let m = url.match(/drive\.google\.com\/file\/d\/([^/]+)/);
      if(m) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
      m = url.match(/[?&]id=([^&]+)/);
      if(m && url.indexOf('drive.google')>-1) return 'https://drive.google.com/file/d/'+m[1]+'/preview';
      m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{6,})/);
      if(m) return 'https://www.youtube.com/embed/'+m[1];
      return url;
    }

    function showVideo(title, link){
      link = (link||'').trim();
      document.getElementById('modalTitle').textContent = title;
      const body = document.getElementById('modalBody');
      if(!link){ body.textContent = "(chưa có video)"; }
      else {
        body.innerHTML = '<iframe src="'+toEmbed(link)+'" style="width:100%;height:360px;border:0;border-radius:8px" allow="autoplay; encrypted-media" allowfullscreen></iframe>'
          + '<div style="margin-top:8px"><a href="'+link+'" target="_blank" class="text-indigo-600 underline">Mở tab mới</a></div>';
      }
      const m = document.getElementById('modal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }

    async function loadData(){
      const st = document.getElementById('status');
      st.textContent = "Đang tải dữ liệu...";
      try{
        const res = await fetch(LIST_URL + "?t=" + Date.now());
        const data = await res.json();
        const rows = (data.rows || []);
        const tbody = document.getElementById('rows');
        if(!rows.length){ tbody.innerHTML = '<tr><td colspan="10" class="px-3 py-6 text-center text-slate-400">Chưa có video nào.</td></tr>'; st.textContent="0 video."; return; }
        window._rows = rows;
        tbody.innerHTML = rows.map((r,i) => {
          const hasFinal = r.kb_final && r.kb_final.trim();
          const badge = hasFinal
            ? '<span class="px-2 py-1 rounded-full bg-green-100 text-green-700 text-xs">Đã có final</span>'
            : '<span class="px-2 py-1 rounded-full bg-amber-100 text-amber-700 text-xs">'+esc(r.status||'Đang chờ')+'</span>';
          const finalCell = hasFinal
            ? (/^https?:\/\//.test(r.kb_final.trim())
                ? '<a href="'+esc(r.kb_final)+'" target="_blank" class="text-indigo-600 underline">Mở link</a>'
                : '<button onclick="showDemo(\'KB Final\', window._rows['+i+'].kb_final)" class="text-indigo-600 underline">Xem</button>')
            : '<span class="text-slate-400">—</span>';
          return '<tr class="border-b hover:bg-slate-50">'
            + '<td class="px-3 py-2">'+esc(r.stt)+'</td>'
            + '<td class="px-3 py-2 font-mono text-xs">'+esc(r.sku)+'</td>'
            + '<td class="px-3 py-2">'+esc(r.series)+'</td>'
            + '<td class="px-3 py-2">'+esc(r.title)+'</td>'
            + '<td class="px-3 py-2">'+badge+'</td>'
            + '<td class="px-3 py-2"><button onclick="showDemo(\''+esc(r.title)+'\', window._rows['+i+'].kb_demo)" class="text-indigo-600 underline">Xem</button></td>'
            + '<td class="px-3 py-2">'+finalCell+'</td>'
            + '<td class="px-3 py-2">'+(r.video_demo&&r.video_demo.trim()?'<button onclick="showVideo(\'Video Demo\', window._rows['+i+'].video_demo)" class="text-indigo-600 underline">▶ Xem</button>':'<span class="text-slate-400">—</span>')+'</td>'
            + '<td class="px-3 py-2">'+(r.video_final&&r.video_final.trim()?'<button onclick="showVideo(\'Video Final\', window._rows['+i+'].video_final)" class="text-indigo-600 underline">▶ Xem</button>':'<span class="text-slate-400">—</span>')+'</td>'
            + '<td class="px-3 py-2 text-xs text-slate-400">'+esc((r.updated_at||'').substring(0,10))+'</td>'
            + '</tr>';
        }).join('');
        st.textContent = rows.length + " video.";
      }catch(e){ st.textContent = "Lỗi tải dữ liệu: " + e.message; }
    }
    loadData();
  </script>
</body>
</html>
